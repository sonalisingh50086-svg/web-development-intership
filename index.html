<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Studio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }
        header {
            background: #6c4cff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }
        nav a {
            margin: 15px;
            text-decoration: none;
            color: #6c4cff;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 45px;
        }
        .hero p {
            font-size: 18px;
        }
        button {
            background: #6c4cff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nova Studio</h1>
        <p>Creative Ideas. Digital Excellence.</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h1>Welcome to Nova Studio</h1>
        <p>We create beautiful digital experiences.</p>
        <button onclick="alert('Welcome to Nova Studio!')">
            Get Started
        </button>
    </section>

    <footer>
        <p>© 2026 Nova Studio. All Rights Reserved.</p>
    </footer>

</body>
</html>
